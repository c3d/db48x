name: Build DB48X

on:
  push:
    branches: [ stable, dev ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]'
  pull_request:
    branches: [ stable, dev ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-simulator-macos:
    name: macOS DB48x
    runs-on: macos-latest
    env:
      APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.2'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtmultimedia'

    - name: Build simulator
      run: |
        echo "${{ github.run_number }}" > .build_id
        make sim

    - name: Deploy Qt dependencies
      run: |
        macdeployqt db48x.app

    - name: Code sign macOS app (with Apple Developer certificate)
      if: ${{ env.APPLE_CERT_DATA != '' }}
      uses: lando/code-sign-action@v3
      with:
        file: db48x.app
        certificate-data: ${{ secrets.APPLE_CERT_DATA }}
        certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
        apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
        apple-notary-user: ${{ secrets.APPLE_NOTARY_USER }}
        apple-notary-password: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        apple-product-id: org.db48x.simulator

    - name: Code sign macOS app (ad-hoc fallback)
      if: ${{ env.APPLE_CERT_DATA == '' }}
      run: |
        codesign --force --deep --sign - db48x.app

    - name: Create test app tarball
      run: tar -czf db48x-test-app.tar.gz db48x.app/

    - name: Upload test app artifact
      uses: actions/upload-artifact@v7
      with:
        name: db48x-test-app-macos
        path: db48x-test-app.tar.gz
        retention-days: 1

    - name: Create macOS archive
      run: |
        chmod +x allow-db48x-macos.sh
        zip -r db48x-macos.zip db48x.app allow-db48x-macos.sh

    - name: Upload simulator artifact
      uses: actions/upload-artifact@v7
      with:
        name: db48x-simulator-macos
        path: db48x-macos.zip
        retention-days: 7

  build-simulator-linux:
    name: Ubuntu DB48x
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libgl1-mesa-dev libxkbcommon-x11-0 libfreetype6-dev pkg-config

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.2'
        host: 'linux'
        target: 'desktop'
        modules: 'qtmultimedia'

    - name: Build simulator
      run: |
        echo "${{ github.run_number }}" > .build_id
        make sim

    - name: Upload simulator artifact
      uses: actions/upload-artifact@v7
      with:
        name: db48x-simulator-linux
        path: |
          db48x
          help/
        retention-days: 7

  build-simulator-linux-fedora:
    name: Fedora DB48x
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Install git
      run: dnf install -y git

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        dnf install -y @development-tools gcc gcc-c++ git which python3 \
          python3-pip glibc-langpack-en \
          pulseaudio-libs-devel \
          libxcb-devel mesa-libGL-devel libxkbcommon-x11-devel freetype-devel \
          pkgconfig xcb-util-wm-devel xcb-util-image-devel \
          xcb-util-keysyms-devel xcb-util-renderutil-devel

    - name: Cache Qt
      uses: actions/cache@v4
      id: cache-qt
      with:
        path: /opt/Qt/6.9.2
        key: qt-6.9.2-linux-gcc_64-qtmultimedia

    - name: Install Qt
      if: steps.cache-qt.outputs.cache-hit != 'true'
      run: |
        python3 -m pip install aqtinstall
        python3 -m aqt install-qt linux desktop 6.9.2 --outputdir /opt/Qt \
          --modules qtmultimedia

    - name: Add Qt to PATH
      run: echo "/opt/Qt/6.9.2/gcc_64/bin" >> "$GITHUB_PATH"

    - name: Build simulator
      run: |
        echo "${{ github.run_number }}" > .build_id
        make sim

    - name: Upload simulator artifact
      uses: actions/upload-artifact@v7
      with:
        name: db48x-simulator-linux-fedora
        path: |
          db48x
          help/
        retention-days: 7

  build-simulator-linux-arch:
    name: Arch DB48x
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Install git
      run: pacman -Sy --noconfirm git

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install system dependencies
      run: |
        pacman -Syu --noconfirm base-devel git which python python-pip \
          libpulse fontconfig libxcb mesa libxkbcommon-x11 freetype2 pkgconf \
          xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil

    - name: Cache Qt
      uses: actions/cache@v4
      id: cache-qt
      with:
        path: /opt/Qt/6.9.2
        key: qt-6.9.2-linux-gcc_64-qtmultimedia

    - name: Install Qt
      if: steps.cache-qt.outputs.cache-hit != 'true'
      run: |
        python -m pip install --break-system-packages aqtinstall
        python -m aqt install-qt linux desktop 6.9.2 --outputdir /opt/Qt \
          --modules qtmultimedia

    - name: Add Qt to PATH
      run: echo "/opt/Qt/6.9.2/gcc_64/bin" >> "$GITHUB_PATH"

    - name: Build simulator
      run: |
        echo "${{ github.run_number }}" > .build_id
        make sim

    - name: Upload simulator artifact
      uses: actions/upload-artifact@v7
      with:
        name: db48x-simulator-linux-arch
        path: |
          db48x
          help/
        retention-days: 7

  build-simulator-windows:
    name: Windows DB48x
    runs-on: windows-latest
    env:
      WINDOWS_CERT_DATA: ${{ secrets.WINDOWS_CERT_DATA }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup MSYS2 with Qt6
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-make
          mingw-w64-ucrt-x86_64-freetype
          mingw-w64-ucrt-x86_64-pkg-config
          mingw-w64-ucrt-x86_64-libsystre
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-declarative
          mingw-w64-ucrt-x86_64-qt6-multimedia
          mingw-w64-ucrt-x86_64-qt6-translations
          mingw-w64-ucrt-x86_64-qt6-tools
          mingw-w64-ucrt-x86_64-libgfortran

    - name: Build simulator
      shell: msys2 {0}
      run: |
        echo "${{ github.run_number }}" > .build_id
        mingw32-make sim

    - name: Upload Windows help file for debugging
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: db48x-help-windows
        path: help/db48x.md
        if-no-files-found: error
        retention-days: 1

    - name: Deploy Qt dependencies
      shell: msys2 {0}
      run: |
        windeployqt6 db48x.exe
        # Copy UCRT64 runtime and MSYS2 dependencies
        cp /ucrt64/bin/libgcc_s_seh-1.dll .
        cp /ucrt64/bin/libstdc++-6.dll .
        cp /ucrt64/bin/libwinpthread-1.dll .
        cp /ucrt64/bin/libsystre-0.dll .
        cp /ucrt64/bin/libtre-5.dll .
        cp /ucrt64/bin/libintl-8.dll .
        cp /ucrt64/bin/libiconv-2.dll .
        # Copy all Qt dependency DLLs
        cp /ucrt64/bin/libb2-1.dll .
        cp /ucrt64/bin/libdouble-conversion.dll .
        cp /ucrt64/bin/libicuin*.dll .
        cp /ucrt64/bin/libicuuc*.dll .
        cp /ucrt64/bin/libicudt*.dll .
        cp /ucrt64/bin/libpcre2-16-0.dll .
        cp /ucrt64/bin/zlib1.dll .
        cp /ucrt64/bin/libzstd.dll .
        cp /ucrt64/bin/libfreetype-6.dll .
        cp /ucrt64/bin/libharfbuzz-0.dll .
        cp /ucrt64/bin/libmd4c.dll .
        cp /ucrt64/bin/libpng16-16.dll .
        cp /ucrt64/bin/libbrotlidec.dll .
        cp /ucrt64/bin/libbrotlicommon.dll .
        cp /ucrt64/bin/libbz2-1.dll .
        cp /ucrt64/bin/libglib-2.0-0.dll .
        cp /ucrt64/bin/libgraphite2.dll .
        cp /ucrt64/bin/libpcre2-8-0.dll .

    - name: Code sign Windows executable
      if: ${{ env.WINDOWS_CERT_DATA != '' }}
      uses: lando/code-sign-action@v3
      with:
        file: db48x.exe
        certificate-data: ${{ secrets.WINDOWS_CERT_DATA }}
        certificate-password: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    - name: Upload simulator artifact
      uses: actions/upload-artifact@v7
      with:
        name: db48x-simulator-windows
        path: |
          db48x.exe
          *.dll
          platforms/
          imageformats/
          tls/
          translations/
          help/
        retention-days: 7

  build-color-simulator-macos:
    name: macOS DB50x
    runs-on: macos-latest
    env:
      APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}

    steps:
    - name: Checkout code
