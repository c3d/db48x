      run: |
        codesign --force --deep --sign - db50x.app

    - name: Create test app tarball
      run: tar -czf db50x-test-app.tar.gz db50x.app/

    - name: Upload test app artifact
      uses: actions/upload-artifact@v7
      with:
        name: db50x-test-app-macos
        path: db50x-test-app.tar.gz
        retention-days: 1

    - name: Create macOS archive
      run: |
        chmod +x allow-db50x-macos.sh
        zip -r db50x-macos.zip db50x.app allow-db50x-macos.sh

    - name: Upload color simulator artifact
      uses: actions/upload-artifact@v7
      with:
        name: db50x-color-simulator-macos
        path: db50x-macos.zip
        retention-days: 7

  build-color-simulator-linux:
    name: Ubuntu DB50x
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
