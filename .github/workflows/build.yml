        pacman -Syu --noconfirm libpulse fontconfig libxcb mesa libxkbcommon-x11 freetype2 \
          xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil

    - name: Cache Qt
      uses: actions/cache@v4
      id: cache-qt
      with:
        path: /opt/Qt/6.9.2
        key: qt-6.9.2-linux-gcc_64-qtmultimedia

    - name: Install Qt
      if: steps.cache-qt.outputs.cache-hit != 'true'
      run: |
        pacman -Syu --noconfirm python python-pip
        python -m pip install --break-system-packages aqtinstall
        python -m aqt install-qt linux desktop 6.9.2 --outputdir /opt/Qt \
          --modules qtmultimedia

    - name: Add Qt to PATH
      run: echo "/opt/Qt/6.9.2/gcc_64/bin" >> "$GITHUB_PATH"

    - name: Download simulator
      uses: actions/download-artifact@v7
      with:
        name: db48x-simulator-linux-arch
        path: .

    - name: Make binary executable
      run: chmod +x db48x

    - name: Run test shard
      run: ./db48x -H -I -w 20000 -r 50 ${{ matrix.flags }}

  test-color-simulator-linux-arch:
    name: Test Arch DB50x - ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: [build-color-simulator-linux-arch]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ui-control,           flags: "-Tdefaults -Tshifts -Tkeyboard -Teditor -Tstack -Tistack -Tglobals -Tlocals -Tfor_loops -Tconditionals -Tlogical -Tarithmetic" }
          - { name: numerics-trig,        flags: "-Tstyles -Tiformat -Tdformat -Tifunctions -Tdfunctions -Tdfc -Tfloat -Tdouble -Thighp -Tround -Ttrigoptim -Ttrigunits -Tsectrig -Thyprecip -Tdfrac" }
          - { name: complex-ranges-units, flags: "-Tctypes -Tcarith -Tcfunctions -Tautocplx -Tranges -Tuncertain -Tunits -Tsorting" }
          - { name: linalg-integration,   flags: "-Tlists -Tvectors -Tmatrices -Trref -Tlu -Tsolver -Tintegrate -Tsyminteg" }
          - { name: symbolic-poly,        flags: "-Tsimplify -Trewrites -Tsymbolic -Tderivative -Tprimitive -Tprootzeros -Tpoly -Tpartfrac -Tquorem -Tprimes -Txq -Texpr" }
          - { name: constants-equations,  flags: "-Tcstlib -Tequations -Tcolnbeams -Tconstops -Tconstants -Tcharacters -Tautoconst" }
          - { name: flags-infrastructure, flags: "-Tsysflags -Tflags -Tsettings -Trotate -Ttagged -Tcycle -Ttext -Thms -Tdate -Tinfinity -Toverflow -Thelp -Tgstack" }
          - { name: plotting-stats,       flags: "-Tdefaults -Tplotting -Tplotfns -Tgraphics -Tinput -Tstatistics -Tprobabilities -Tinsert -Trandom -Texplode -Tfinance -Tlibrary -Tsumprod" }
          - { name: commands-demos,       flags: "-Tcommands -Tdemo_ui -Tdemo_math -Tdemo_pgm -Tregressions" }
          - { name: examples-1,           flags: "-Texamples -texample_start=1:example_end=267" }
          - { name: examples-2,           flags: "-Texamples -texample_start=268:example_end=533" }
          - { name: examples-3,           flags: "-Texamples -texample_start=534:example_end=800" }
          - { name: examples-4,           flags: "-Texamples -texample_start=801:example_end=1066" }
          - { name: examples-5,           flags: "-Texamples -texample_start=1067:example_end=1333" }
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      QT_QPA_PLATFORM: offscreen
    steps:
    - name: Install git
      run: pacman -Sy --noconfirm git

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install runtime dependencies
      run: |
        pacman -Syu --noconfirm libpulse fontconfig libxcb mesa libxkbcommon-x11 freetype2 \
          xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil

    - name: Cache Qt
      uses: actions/cache@v4
      id: cache-qt
      with:
        path: /opt/Qt/6.9.2
        key: qt-6.9.2-linux-gcc_64-qtmultimedia

    - name: Install Qt
      if: steps.cache-qt.outputs.cache-hit != 'true'
      run: |
        pacman -Syu --noconfirm python python-pip
        python -m pip install --break-system-packages aqtinstall
        python -m aqt install-qt linux desktop 6.9.2 --outputdir /opt/Qt \
          --modules qtmultimedia

    - name: Add Qt to PATH
      run: echo "/opt/Qt/6.9.2/gcc_64/bin" >> "$GITHUB_PATH"

    - name: Download simulator
      uses: actions/download-artifact@v7
      with:
        name: db50x-color-simulator-linux-arch
        path: .

    - name: Make binary executable
      run: chmod +x db50x

    - name: Run test shard
      run: ./db50x -H -I -w 20000 -r 50 ${{ matrix.flags }}

  build-wasm:
    name: WASM simulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype6-dev pkg-config

    - name: Generate recorder config header
      run: |
        make -C recorder TARGET=opt BUILDENV=auto RECURSE=.config .config
        cp recorder/.build/linux/opt/config.h recorder/config.h

    - name: Cache emsdk
      uses: actions/cache@v4
      with:
        path: emsdk/upstream
        key: emsdk-upstream-${{ runner.os }}-latest-v1

    - name: Install Emscripten
      run: |
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest

    - name: Build WASM
      shell: bash
      run: |
        echo "${{ github.run_number }}" > .build_id
        make -j4 SHELL=/bin/bash wasm

    - name: Upload WASM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: db48x-wasm
        path: |
          wasm/db48x.js
          wasm/db48x.wasm
          wasm/*.html
          help/
        retention-days: 7

  build-android:
    name: Android DB48x
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_DATA }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Qt for Android
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtmultimedia'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Cache Android NDK
      uses: actions/cache@v4
      id: cache-ndk
      with:
        path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        key: android-ndk-27.2.12479018

    - name: Install Android NDK
      if: steps.cache-ndk.outputs.cache-hit != 'true'
      run: sdkmanager --install "ndk;27.2.12479018"

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype6-dev pkg-config

    - name: Build Android App Bundle
      run: |
        echo "${{ github.run_number }}" > .build_id
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018
        export ANDROID_QT_BASE="$(dirname "$QT_ROOT_DIR")"
        if [ -n "$ANDROID_KEYSTORE_DATA" ]; then
          mkdir -p "$HOME/.local"
          echo "$ANDROID_KEYSTORE_DATA" | base64 -d > "$HOME/.local/android_release.keystore"
        fi
        make android
      env:
        ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

    - name: List generated AAB files
      run: |
        echo "Looking for AAB files in workspace:"
        find . -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"

    - name: Verify generated AAB
      run: test -f android/db48x/db48x.aab

    - name: Upload Android artifacts
      uses: actions/upload-artifact@v7
      with:
        name: db48x-android
        if-no-files-found: error
        path: |
          android/*.aab
          android/**/*.aab
          android/build/outputs/apk/**/*.apk
          help/
        retention-days: 7

