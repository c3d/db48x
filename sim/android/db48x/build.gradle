buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: (project.findProperty('qtGradlePluginType') ?: 'com.android.application')

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    //noinspection GradleDependency
    implementation 'androidx.core:core:1.13.1'
}

def rawVersion = project.findProperty("PACKAGE_VERSION")?.toString()?.trim()
if (!rawVersion || rawVersion == "unknown") {
    rawVersion = "v0.0.0"
}

// Matches "v0.10.0" as well as "v0.10.0-14-gabc1234"
def matcher = (rawVersion =~ /^v?(\d+)\.(\d+)\.(\d+)(?:-(\d+)-g[0-9a-f]+)?/)

int major = 0
int minor = 0
int patch = 0
int commitOffset = 0

if (matcher.find()) {
    major = matcher.group(1).toInteger()
    minor = matcher.group(2).toInteger()
    patch = matcher.group(3).toInteger()
    if (matcher.group(4) != null) {
        commitOffset = matcher.group(4).toInteger()
    }
}

// v0.10.0 -> 1000000; v0.10.0-1-g... -> 1000001; v0.10.1 -> 1001000
int computedVersionCode = Math.max(1, (major * 10000000) + (minor * 100000) + (patch * 1000) + commitOffset)

android {
    /*******************************************************
     * The following variables:
     * - androidBuildToolsVersion,
     * - androidCompileSdkVersion
     * - qtAndroidDir - holds the path to qt android files
     *                   needed to build any Qt application
     *                   on Android.
     * - qtGradlePluginType - whether to build an app or a library
     *
     * are defined in gradle.properties file. This file is
     * updated by QtCreator and androiddeployqt tools.
     * Changing them manually might break the compilation!
     *******************************************************/

    namespace = androidPackageName
    compileSdkVersion = androidCompileSdkVersion
    buildToolsVersion = androidBuildToolsVersion
    ndkVersion = androidNdkVersion

    // Extract native libraries from the APK
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qtAndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qtAndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qtAndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            renderscript.srcDirs = ['src']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
       }
    }

    tasks.withType(JavaCompile).configureEach {
        options.incremental = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }

    // Do not compress Qt binary resources file
    androidResources {
        noCompress += 'rcc'
    }

    defaultConfig {
        resourceConfigurations += ["en"]
        applicationId "org.db48x"
        versionCode computedVersionCode
        versionName rawVersion
        minSdkVersion = qtMinSdkVersion
        // Use Qt's target SDK, but ensure minimum for Google Play Store.
        targetSdkVersion = Math.max(qtTargetSdkVersion as Integer, 36)
        ndk.abiFilters = qtTargetAbiList.split(",")
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: System.getProperty("user.home") + "/.local/android_release.keystore"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASS") ?: ""
                keyAlias "db48x"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASS") ?: ""
            }
        }
    }

    buildTypes {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: System.getProperty("user.home") + "/.local/android_release.keystore"
            if (file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
