          cp libdb50x_arm64-v8a.so ../android/libs/arm64-v8a/ && \
          $QT_HOST_PATH/bin/androiddeployqt \
            --input android-db50x-deployment-settings.json \
            --output ../android --gradle --aab
      fi
  artifacts:
    name: "db50x-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - android/*.aab
      - help/
    expire_in: 30 days

# DM42 Firmware Build
build-dm42-firmware:
  stage: build
  image: fedora:latest
  tags:
    - docker
  before_script:
    - dnf install -y @development-tools git arm-none-eabi-gcc-cs arm-none-eabi-binutils-cs arm-none-eabi-newlib freetype-devel pkgconfig
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make all || make all
    - make dist || make dist
  artifacts:
    name: "db48x-dm42-firmware-$CI_COMMIT_SHORT_SHA"
    paths:
      - db48x-v*.tgz
    expire_in: 30 days

# DM32 Firmware Build
build-dm32-firmware:
  stage: build
  image: fedora:latest
  tags:
    - docker
  before_script:
    - dnf install -y @development-tools git arm-none-eabi-gcc-cs arm-none-eabi-binutils-cs arm-none-eabi-newlib freetype-devel pkgconfig
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make dm32-all || make dm32-all
    - make dm32-dist || make dm32-dist
  artifacts:
    name: "db50x-dm32-firmware-$CI_COMMIT_SHORT_SHA"
    paths:
      - db50x-v*.tgz
    expire_in: 30 days

# Release Package
build-release-package:
  stage: package
  image: fedora:latest
  tags:
    - docker
  dependencies:
    - build-dm42-firmware
    - build-dm32-firmware
    - build-android
    - build-color-android
    - build-wasm
  script:
    - tar czf db48x-dm42-${CI_COMMIT_SHORT_SHA}.tar.gz db48x.pgm db48x_qspi.bin help/db48x.md help/db48x.idx
    - tar czf db50x-dm32-${CI_COMMIT_SHORT_SHA}.tar.gz db50x.pg5 db50x_qspi.bin help/db50x.md help/db50x.idx
    - tar czf db48x-android-${CI_COMMIT_SHORT_SHA}.tar.gz android/*.aab
    - tar czf db50x-android-${CI_COMMIT_SHORT_SHA}.tar.gz android/*.aab
    - tar czf db48x-wasm-${CI_COMMIT_SHORT_SHA}.tar.gz wasm/
  artifacts:
    name: "release-packages-$CI_COMMIT_SHORT_SHA"
    paths:
      - db48x-dm42-*.tar.gz
      - db50x-dm32-*.tar.gz
      - db48x-android-*.tar.gz
      - db50x-android-*.tar.gz
      - db48x-wasm-*.tar.gz
    expire_in: 90 days
  only:
    - stable
    - dev
