# Android Builds (Fedora)
build-android:
  stage: build
  image: fedora:latest
  before_script:
    - dnf install -y gcc gcc-c++ make which git wget curl tar unzip glib2 dbus-devel pulseaudio-libs-devel freetype-devel pkgconfig python3 python3-pip
    - curl -fsSL "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse" -o /tmp/jdk17.tar.gz
    - mkdir -p $HOME/jdk17 && tar -xzf /tmp/jdk17.tar.gz -C $HOME/jdk17 --strip-components=1
    - export JAVA_HOME=$HOME/jdk17
    - export PATH=$JAVA_HOME/bin:$PATH
    - java -version
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - mkdir -p $HOME/android-sdk/cmdline-tools
    - unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
    - mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
    - export ANDROID_SDK_ROOT=$HOME/android-sdk
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    - yes | sdkmanager --licenses || true
    - sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
    - export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125
    - python3 -m pip install aqtinstall
    - python3 -m aqt install-qt linux android 6.9.2 android_arm64_v8a --outputdir $HOME/Qt --modules qtmultimedia
    - python3 -m aqt install-qt linux desktop 6.9.2 --outputdir $HOME/Qt --modules qtmultimedia
    - export Qt6_DIR=$HOME/Qt/6.9.2/android_arm64_v8a
    - export QT_HOST_PATH=$HOME/Qt/6.9.2/gcc_64
    - export ANDROID_QT_BASE=$HOME/Qt/6.9.2
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - |
      if [ -n "$ANDROID_KEYSTORE_DATA" ]; then
        mkdir -p $HOME/.local
        echo "$ANDROID_KEYSTORE_DATA" | base64 -d > $HOME/.local/android_release.keystore
      fi
    - make android
    - test -f android/db48x.aab
  artifacts:
    name: "db48x-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - android/*.aab
      - help/
    expire_in: 30 days

