stages:
  - build
  - package

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# macOS Simulator Builds
build-simulator-macos:
  stage: build
  tags:
    - macos
  before_script:
    - brew install qt@6
    - export PATH="/usr/local/opt/qt@6/bin:$PATH"
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make sim
    - macdeployqt sim/db48x.app
    - |
      if [ -n "$APPLE_CERT_DATA" ]; then
        echo "Using proper Apple Developer code signing"
        # Note: lando/code-sign-action is GitHub Actions specific
        # For GitLab, you'd need to implement similar signing logic or use a script
        # For now, fall back to ad-hoc signing
        codesign --force --deep --sign - sim/db48x.app
      else
        echo "Using ad-hoc code signing (no Apple Developer certificate)"
        codesign --force --deep --sign - sim/db48x.app
      fi
  artifacts:
    name: "db48x-simulator-macos-$CI_COMMIT_SHORT_SHA"
    paths:
      - sim/db48x.app
      - help/
    expire_in: 30 days

build-color-simulator-macos:
  stage: build
  tags:
    - macos
  before_script:
    - brew install qt@6
    - export PATH="/usr/local/opt/qt@6/bin:$PATH"
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make color-dm32-sim
    - macdeployqt sim/db50x.app
    - |
      if [ -n "$APPLE_CERT_DATA" ]; then
        echo "Using proper Apple Developer code signing"
        # Note: lando/code-sign-action is GitHub Actions specific
        # For GitLab, you'd need to implement similar signing logic or use a script
        # For now, fall back to ad-hoc signing
        codesign --force --deep --sign - sim/db50x.app
      else
        echo "Using ad-hoc code signing (no Apple Developer certificate)"
        codesign --force --deep --sign - sim/db50x.app
      fi
  artifacts:
    name: "db50x-color-simulator-macos-$CI_COMMIT_SHORT_SHA"
    paths:
      - sim/db50x.app
      - help/
    expire_in: 30 days

# Linux Simulator Builds
build-simulator-linux:
  stage: build
  image: fedora:latest
  tags:
    - docker
  before_script:
    - dnf install -y @development-tools git python3 python3-pip libxcb-devel mesa-libGL-devel libxkbcommon-x11-devel freetype-devel pkgconfig xcb-util-wm-devel xcb-util-image-devel xcb-util-keysyms-devel xcb-util-renderutil-devel
    - python3 -m pip install aqtinstall
    - python3 -m aqt install-qt linux desktop 6.5.3 --outputdir /opt/Qt --modules qtmultimedia
    - export PATH="/opt/Qt/6.5.3/gcc_64/bin:$PATH"
    - export QT_QPA_PLATFORM=offscreen
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make sim
  artifacts:
    name: "db48x-simulator-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - sim/db48x
      - help/
    expire_in: 30 days

build-color-simulator-linux:
  stage: build
  image: fedora:latest
  tags:
    - docker
  before_script:
    - dnf install -y @development-tools git python3 python3-pip libxcb-devel mesa-libGL-devel libxkbcommon-x11-devel freetype-devel pkgconfig xcb-util-wm-devel xcb-util-image-devel xcb-util-keysyms-devel xcb-util-renderutil-devel
    - python3 -m pip install aqtinstall
    - python3 -m aqt install-qt linux desktop 6.5.3 --outputdir /opt/Qt --modules qtmultimedia
    - export PATH="/opt/Qt/6.5.3/gcc_64/bin:$PATH"
    - export QT_QPA_PLATFORM=offscreen
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make color-dm32-sim
  artifacts:
    name: "db50x-color-simulator-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - sim/db50x
      - help/
    expire_in: 30 days

# Windows Simulator Builds
build-simulator-windows:
  stage: build
  tags:
    - windows
  cache:
    key: msys2-packages-v1
    paths:
      - C:\tools\msys64\var\cache\pacman\pkg\
  before_script:
    - choco install -y msys2
    - C:\tools\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-freetype mingw-w64-x86_64-pkg-config mingw-w64-x86_64-libgnurx mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-declarative mingw-w64-x86_64-qt6-multimedia"
    - $env:PATH = "C:\tools\msys64\mingw64\bin;$env:PATH"
  script:
    - echo $env:CI_PIPELINE_IID > .build_id
    - mingw32-make sim
    - cd sim/debug
    - windeployqt6 db48x.exe
    - |
      # Copy MinGW runtime and MSYS2 dependencies
      Copy-Item C:\tools\msys64\mingw64\bin\libgcc_s_seh-1.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libstdc++-6.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libwinpthread-1.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libsystre-0.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libtre-5.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libintl-8.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libiconv-2.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libb2-1.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libdouble-conversion.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libicuin*.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libicuuc*.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libicudt*.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libpcre2-16-0.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\zlib1.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libzstd.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libfreetype-6.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libharfbuzz-0.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libmd4c.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libpng16-16.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libbrotlidec.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libbrotlicommon.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libbz2-1.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libglib-2.0-0.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libgraphite2.dll .
      Copy-Item C:\tools\msys64\mingw64\bin\libpcre2-8-0.dll .
    - cd ../..
  artifacts:
    name: "db48x-simulator-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - sim/debug/db48x.exe
      - sim/debug/*.dll
      - sim/debug/platforms/
      - sim/debug/imageformats/
      - sim/debug/tls/
      - help/
    expire_in: 30 days

