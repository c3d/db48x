stages:
  - build
  - package

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# macOS Simulator Builds (requires a self-hosted runner tagged `macos`)
build-simulator-macos:
  stage: build
  tags:
    - macos
  allow_failure: true
  before_script:
    - |
      if [ -x /opt/homebrew/bin/brew ]; then
        eval "$(/opt/homebrew/bin/brew shellenv)"
      elif [ -x /usr/local/bin/brew ]; then
        eval "$(/usr/local/bin/brew shellenv)"
      fi
      if ! command -v qmake6 >/dev/null 2>&1; then
        brew install qt@6 || {
          echo "Install Qt 6 on the macOS runner: brew install qt@6"
          exit 1
        }
      fi
      export PATH="$(brew --prefix qt@6)/bin:$PATH"
      command -v qmake6 >/dev/null || {
        echo "Install Qt 6 on the macOS runner: brew install qt@6"
        exit 1
      }
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make sim
    - macdeployqt db48x.app
    - |
      if [ -n "$APPLE_CERT_DATA" ]; then
        echo "Using proper Apple Developer code signing"
        codesign --force --deep --sign - db48x.app
      else
        echo "Using ad-hoc code signing (no Apple Developer certificate)"
        codesign --force --deep --sign - db48x.app
      fi
    - chmod +x allow-db48x-macos.sh
    - zip -r db48x-macos.zip db48x.app allow-db48x-macos.sh
  artifacts:
    name: "db48x-simulator-macos-$CI_COMMIT_SHORT_SHA"
    paths:
      - db48x-macos.zip
    expire_in: 30 days

