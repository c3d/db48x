# Linux Simulator Builds (Fedora)
build-simulator-linux:
  stage: build
  image: fedora:latest
  before_script:
    - dnf install -y gcc gcc-c++ make which git python3 python3-pip glib2 dbus-devel pulseaudio-libs-devel libxcb-devel mesa-libGL-devel libxkbcommon-x11-devel freetype-devel pkgconfig xcb-util-wm-devel xcb-util-image-devel xcb-util-keysyms-devel xcb-util-renderutil-devel
    - python3 -m pip install aqtinstall
    - python3 -m aqt install-qt linux desktop 6.9.2 --outputdir /opt/Qt --modules qtmultimedia
    - export PATH="/opt/Qt/6.9.2/gcc_64/bin:$PATH"
    - export QT_QPA_PLATFORM=offscreen
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make sim
  artifacts:
    name: "db48x-simulator-linux-$CI_COMMIT_SHORT_SHA"
    paths:
      - db48x
      - help/
    expire_in: 30 days

