    - python3 -m aqt install-qt linux android 6.8.1 android_arm64_v8a --outputdir $HOME/Qt --modules qtmultimedia
    - python3 -m aqt install-qt linux desktop 6.8.1 gcc_64 --outputdir $HOME/Qt
    - export Qt6_DIR=$HOME/Qt/6.8.1/android_arm64_v8a
    - export QT_HOST_PATH=$HOME/Qt/6.8.1/gcc_64
