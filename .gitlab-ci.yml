# WebAssembly Build (Fedora)
build-wasm:
  stage: build
  image: fedora:latest
  before_script:
    - dnf install -y gcc gcc-c++ make git python3 curl freetype-devel pkgconfig
    - git submodule update --init emsdk
    - cd emsdk
    - ./emsdk install latest
    - ./emsdk activate latest
    - cd ..
  script:
    - make -C recorder TARGET=opt BUILDENV=auto RECURSE=.config .config
    - cp recorder/.build/linux/opt/config.h recorder/config.h
    - source emsdk/emsdk_env.sh
    - echo "$CI_PIPELINE_IID" > .build_id
    - make SHELL=/bin/bash wasm
  artifacts:
    name: "db48x-wasm-$CI_COMMIT_SHORT_SHA"
    paths:
      - wasm/db48x.js
      - wasm/db48x.wasm
      - wasm/*.html
      - help/
    expire_in: 30 days

