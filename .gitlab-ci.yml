    - make COLOR=color sim/config.qrc sim/state.qrc sim/library.qrc sim/help.qrc sim/help/img.qrc
    - cd recorder && make TARGET=opt && cd ..
    - |
      if [ -n "$ANDROID_KEYSTORE_DATA" ]; then
