# Release Package
build-release-package:
  stage: package
  image: fedora:latest
  dependencies:
    - build-dm42-firmware
    - build-dm32-firmware
    - build-dm42n-firmware
    - build-android
    - build-color-android
    - build-wasm
    - build-simulator-macos
    - build-color-simulator-macos
  script:
    - cp db48x-dm42-firmware.tgz db48x-dm42-${CI_COMMIT_SHORT_SHA}.tar.gz
    - cp db50x-dm32-firmware.tgz db50x-dm32-${CI_COMMIT_SHORT_SHA}.tar.gz
    - cp db50x-dm42n-firmware.tgz db50x-dm42n-${CI_COMMIT_SHORT_SHA}.tar.gz
    - tar czf db48x-android-${CI_COMMIT_SHORT_SHA}.tar.gz android/db48x.aab
    - tar czf db50x-android-${CI_COMMIT_SHORT_SHA}.tar.gz android/db50x.aab
    - tar czf db48x-wasm-${CI_COMMIT_SHORT_SHA}.tar.gz -C wasm .
    - |
      if [ -f db48x-macos.zip ]; then
        cp db48x-macos.zip db48x-simulator-macos-${CI_COMMIT_SHORT_SHA}.zip
      fi
    - |
      if [ -f db50x-macos.zip ]; then
        cp db50x-macos.zip db50x-color-simulator-macos-${CI_COMMIT_SHORT_SHA}.zip
      fi
  artifacts:
    name: "release-packages-$CI_COMMIT_SHORT_SHA"
    paths:
      - db48x-dm42-*.tar.gz
      - db50x-dm32-*.tar.gz
      - db50x-dm42n-*.tar.gz
      - db48x-android-*.tar.gz
      - db50x-android-*.tar.gz
      - db48x-wasm-*.tar.gz
      - db48x-simulator-macos-*.zip
      - db50x-color-simulator-macos-*.zip
    expire_in: 90 days
  only:
    - stable
    - dev
