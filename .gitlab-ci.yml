# WebAssembly Build
build-wasm:
  stage: build
  image: fedora:latest
  tags:
    - docker
  before_script:
    - dnf install -y @development-tools git python3 curl freetype-devel pkgconfig
    - git clone https://github.com/emscripten-core/emsdk.git
    - cd emsdk
    - ./emsdk install latest
    - ./emsdk activate latest
    - cd ..
  script:
    - source emsdk/emsdk_env.sh
    - echo "$CI_PIPELINE_IID" > .build_id
    - make SHELL=/bin/bash wasm
  artifacts:
    name: "db48x-wasm-$CI_COMMIT_SHORT_SHA"
    paths:
      - wasm/db48x.js
      - wasm/db48x.wasm
      - wasm/*.html
      - help/
    expire_in: 30 days

# Android Builds
build-android:
  stage: build
  image: fedora:latest
  tags:
    - docker
  before_script:
    - dnf install -y @development-tools git java-17-openjdk-devel wget unzip freetype-devel pkgconfig
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
    - export PATH=$JAVA_HOME/bin:$PATH
    # Install Android SDK
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - mkdir -p $HOME/android-sdk/cmdline-tools
    - unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
    - mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
    - export ANDROID_SDK_ROOT=$HOME/android-sdk
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
    - yes | sdkmanager --licenses || true
    - sdkmanager --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"
    - export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125
    # Install Qt for Android
    - python3 -m pip install aqtinstall
    - python3 -m aqt install-qt linux android 6.8.1 android_arm64_v8a --outputdir $HOME/Qt --modules qtmultimedia
    - python3 -m aqt install-qt linux desktop 6.8.1 gcc_64 --outputdir $HOME/Qt
    - export Qt6_DIR=$HOME/Qt/6.8.1/android_arm64_v8a
    - export QT_HOST_PATH=$HOME/Qt/6.8.1/gcc_64
  script:
    - echo "$CI_PIPELINE_IID" > .build_id
    - make src/dmcp/version.h
    - make sim/config.qrc sim/state.qrc sim/library.qrc sim/help.qrc sim/help/img.qrc
    - cd recorder && make TARGET=opt && cd ..
    - |
      if [ -n "$ANDROID_KEYSTORE_DATA" ]; then
        mkdir -p $HOME/.local
        echo "$ANDROID_KEYSTORE_DATA" | base64 -d > $HOME/.local/android_release.keystore
        make android
      else
        cd sim && \
          $Qt6_DIR/bin/qmake -spec android-clang db48x.pro && \
          make VARIANT=android && \
          mkdir -p ../android/libs/arm64-v8a && \
          cp libdb48x_arm64-v8a.so ../android/libs/arm64-v8a/ && \
          $QT_HOST_PATH/bin/androiddeployqt \
            --input android-db48x-deployment-settings.json \
            --output ../android --gradle --aab
      fi
  artifacts:
    name: "db48x-android-$CI_COMMIT_SHORT_SHA"
    paths:
      - android/*.aab
      - help/
    expire_in: 30 days

build-color-android:
  stage: build
  image: fedora:latest
  tags:
    - docker
  before_script:
    - dnf install -y @development-tools git java-17-openjdk-devel wget unzip freetype-devel pkgconfig
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
    - export PATH=$JAVA_HOME/bin:$PATH
    # Install Android SDK
