<!doctype html>

  <link rel="manifest" href="manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB48X App</title>
  <style>
    #generic-container {
      max-width: 550px;
      width: 100%;
      display: flex;
      flex-direction: row;
      gap: 1rem;
    }

    button {
      white-space: nowrap;
    }

    #app-db48x {
      position: relative;
      background-color: #2E2E2E;
      padding: 4% 3% 2% 3%;
      box-sizing: border-box;
      border-radius: 2%;

      #lcd-bezel {
        position: relative;
        width: 100%;
        background-color: black;
        padding: 8% 8% 4%;
        box-sizing: border-box;
        border-top-left-radius: 4%;
        border-top-right-radius: 4%;
        margin-bottom: 2%;


        #lcd {
          width: 100%;
        }
      }

      #keyboard {
        position: relative;
        width: 100%;
        user-select: none;
        border-top-left-radius: 2%;
        border-top-right-radius: 2%;

        img {
          width: 100%;
          height: auto;
          border-top-left-radius: 1%;
          border-top-right-radius: 1%;
          border: black 1px solid;
        }

        svg {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: auto;
        }
      }
    }
  </style>
  <script src="/coi-serviceworker.js"></script>
  <script src="/db48x.js"></script>
</head>

        "8": this.#KB_CMD.KB_8,
        "9": this.#KB_CMD.KB_9,

        "a": this.#KB_CMD.KB_A,
        "b": this.#KB_CMD.KB_B,
        "c": this.#KB_CMD.KB_C,
        "d": this.#KB_CMD.KB_D,
        "e": this.#KB_CMD.KB_E,
        "f": this.#KB_CMD.KB_F,
        "g": this.#KB_CMD.KB_G,
        "h": this.#KB_CMD.KB_H,
        "i": this.#KB_CMD.KB_I,
        "j": this.#KB_CMD.KB_J,
        "k": this.#KB_CMD.KB_K,
        "l": this.#KB_CMD.KB_L,
        "m": this.#KB_CMD.KB_M,
        "n": this.#KB_CMD.KB_N,
        "o": this.#KB_CMD.KB_O,
        "p": this.#KB_CMD.KB_P,
        "q": this.#KB_CMD.KB_Q,
        "r": this.#KB_CMD.KB_R,
        "s": this.#KB_CMD.KB_S,
        "t": this.#KB_CMD.KB_T,
        "u": this.#KB_CMD.KB_U,
        "v": this.#KB_CMD.KB_V,
        "w": this.#KB_CMD.KB_W,
        "x": this.#KB_CMD.KB_X,
        "y": this.#KB_CMD.KB_Y,
        "z": this.#KB_CMD.KB_Z,
      };

      #pressedKeys = [];
      #kb_layer;

      constructor(layer_name, debug) {
        this.#kb_layer = document.getElementById(layer_name);
        this.highlightKeys(debug);
        this.#registerKeyboardListeners();
      }

      sendKeycode(keycode) {
        Module.ui_push_key(keycode);
        if (CONFIG.debug) {
          console.log("keydown (calc): ", keycode);
        }
      }

      sendRelease(keycode) {
        Module.ui_push_key(0);
        if (CONFIG.debug) {
          console.log("keyup (calc): ", keycode);
        }
      }

      highlightKeys(bool) {
        // Hide or show SVG key highlights based on debug mode
        const keys_svg = this.#kb_layer.children;
        for (var i = 0; i < keys_svg.length; i++) {
          const svg = keys_svg[i];
          svg.style["fill-opacity"] = '0';
          if (bool) {
            svg.style["stroke-opacity"] = '1';
          } else {
            svg.style["stroke-opacity"] = '0';
          }
        }
      }

      #registerKeyboardListeners() {
        document.addEventListener("keydown", (event) => {
          if (CONFIG.debug) {
            console.log("keydown (keyboard): ", event.key);
          }
          if (event.key in Keyboard.#KEYMAP && this.#pressedKeys.indexOf(event.key) === -1) {
            this.#pressedKeys.push(event.key);
            this.sendKeycode(Keyboard.#KEYMAP[event.key]);
          }
        })

        document.addEventListener("keyup", (event) => {
          if (CONFIG.debug) {
            console.log("keyup (keyboard): ", event.key);
          }
          if (!(event.key in Keyboard.#KEYMAP)) {
            return;
          }
          this.#pressedKeys.splice(this.#pressedKeys.indexOf(event.key), 1);
          this.sendRelease(Keyboard.#KEYMAP[event.key]);
        })
      }
      onMouseDownHandler(cmd) {
        this.sendKeycode(Keyboard.#KB_CMD[cmd]);
      }
      onMouseUpHandler(cmd) {
        this.sendRelease(Keyboard.#KB_CMD[cmd]);
      }
    }

    class Display {
      #LCD_W = 416;
      #LCD_H = 240;
      #LCD_W_OFFSET = 16;
      #ctx;
      #imagedata;
      #fg_color;
      #bg_color;

      constructor(canvasId, fg_color, bg_color) {
        const lcd_canvas = document.getElementById(canvasId);
        lcd_canvas.width = this.#LCD_W - this.#LCD_W_OFFSET;
        lcd_canvas.height = this.#LCD_H;
        this.#ctx = lcd_canvas.getContext("2d");
        this.#imagedata = this.#ctx.createImageData(this.#LCD_W, this.#LCD_H);
        this.#fg_color = fg_color;
        this.#bg_color = bg_color;
      }

      drawBitmap(lcd_ptr) {
        const lcd_buffer = this.#getLCDBuffer(lcd_ptr);
        for (let i = 0; i < lcd_buffer.length; i++) {
          const bitmask = lcd_buffer[i];
          for (let bit = 0; bit < 32; bit++) {
            const value = (bitmask >> bit) & 1;
            const pixelIndex = i * 32 + bit;
            const x = pixelIndex % this.#LCD_W;
            const y = Math.floor(pixelIndex / this.#LCD_W);
            const mirroredX = this.#LCD_W - 1 - x; // Mirroring the x position
            const index = (y * this.#LCD_W + mirroredX) * 4;
            // const index = (y * width + x) * 4;
            const color = value === 1 ? this.#bg_color : this.#fg_color;
            this.#imagedata.data[index] = color.r;
            this.#imagedata.data[index + 1] = color.g;
            this.#imagedata.data[index + 2] = color.b;
            this.#imagedata.data[index + 3] = 255; // Alpha channel
          }
        }
        this.#ctx.putImageData(this.#imagedata, -this.#LCD_W_OFFSET, 0);
      }

      #getLCDBuffer(lcd_ptr) {
        const lcd_buffer = [];
        for (let i = 0; i < this.#LCD_W * this.#LCD_H / Int32Array.BYTES_PER_ELEMENT; i++) {
          const index = lcd_ptr / Int32Array.BYTES_PER_ELEMENT + i;
          const word = Module.HEAP32[index]
          lcd_buffer.push(word)
        }
        return lcd_buffer;
      }
    }

    class Buzzer {
      #context;
      #oscillator;
      #start;
      #enabled = false

      constructor() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.#context = new AudioContext();
        this.#oscillator = null;
      }

      enable(bool) {
        this.#enabled = bool;
      }

      shortBeep(frequency) {
        if (!this.#enabled)
          return;
        this.#play(frequency);
        setTimeout(() => {
          this.#stop();
        }, 150);
      }

      #play(frequency) {
        if (!this.#enabled)
          return;
        if (!this.#oscillator) {
          this.#oscillator = this.#context.createOscillator();
          this.#oscillator.type = 'square';
          this.#oscillator.frequency.setValueAtTime(frequency, this.#context.currentTime);
          this.#oscillator.connect(this.#context.destination);
          this.#oscillator.start();
        }
      }

      #stop() {
        if (!this.#enabled)
          return;
        if (this.#oscillator) {
          this.#oscillator.stop();
          this.#oscillator.disconnect();
          this.#oscillator = null;
        }
      }
    }

    // ============================================================================
    //
    //   handlers
    //
    // ============================================================================


    const debugBtnHandler = (bool) => {
      CONFIG.debug = bool;
      keyboard.highlightKeys(bool);
      document.getElementById("debug-btn").innerHTML = bool ? "Debug: On" : "Debug: Off";
    }

    const buzzerBtnHandler = (bool) => {
      CONFIG.buzzer = bool
      buzzer.enable(CONFIG.buzzer);
      document.getElementById("buzzer-btn").innerHTML = bool ? "Buzzer: On" : "Buzzer: Off";
    }

    // ============================================================================
    //
    //   main()
    //
    // ============================================================================

    const buzzer = new Buzzer(); // instance created to be used by the C++ code
    const display = new Display("lcd", CONFIG.lcd_fg_color, CONFIG.lcd_bg_color);
    const keyboard = new Keyboard("keyboardLayer", CONFIG.debug);

    // Called to initialize buttons
    debugBtnHandler(CONFIG.debug);
    buzzerBtnHandler(CONFIG.buzzer);

    Module.onRuntimeInitialized = () => {
      var init = Module.ui_init();

      if (CONFIG.debug) {
        console.log("loaded wasm...");
        console.log("ui_init() returned with value: ", init);
      }

      // Calculator's display Read-Print-Loop
      const rpl_loop = () => {
        const lcd_ptr = Module.ui_lcd_buffer();
        if (lcd_ptr)
          window.requestAnimationFrame(() => {
            if (CONFIG.debug) {
              var startTime = performance.now();
            }
            display.drawBitmap(lcd_ptr);
            if (CONFIG.debug) {
              console.log(`Frame rendered in ${performance.now() - startTime} ms`);
            }
          });
        window.setTimeout(rpl_loop, 1000 / CONFIG.FPS);
      }
      window.requestAnimationFrame(rpl_loop);
    }

  </script>
